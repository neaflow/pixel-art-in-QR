<!DOCTYPE html>
<html lang="en">

<head>
    <title>PAQ</title>
    <link rel="icon" type="image/png" href="favi.png">
    <link rel="stylesheet" href="css.css">
</head>

<body>
    <div id="header">
        <h1>PAQ</h1>
    </div>
    <div id="boxes">
        <div id="input-box">
            <label for="image-input" id="upload-button">Upload image</label>
            <input type="file" id="image-input" accept="image/*" hidden>
            <input type="text" id="link-input" placeholder="paste your link here">
        </div>
        <div id="qr-box">
            <p>type a link above...</p>
        </div>
        <div id="output-box">
            <p>upload a pixel art image above...</p>
        </div>
    </div>
    <script src="qrcode.js"></script>
    <script src="js.js"></script>

</body>

</html>
